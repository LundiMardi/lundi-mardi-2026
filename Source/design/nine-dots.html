<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NineDots</title>
<style>
  /* ---------- page (demo only, replace with your own) ---------- */
  html, body { margin: 0; background: #fdfdfd; }
  header { display: grid; place-items: center; padding: 8vh 5vw; }

  /* ---------- NineDots component: copy from here ... ---------- */
  .nd {
    /* LOOP: every disc is back at its start angle (all aligned) after this many seconds */
    --loop: 360;
    /* HOVER, before the first click: every dot shrinks to this same radius
       (artboard units; the smallest disc is 12.3) */
    --equal-r: 7;
    /* HOVER, after a click: the nine original sizes, rearranged, scaled by this factor
       (keep it below 12.3 / 61.8 = 0.199 so the biggest dot stays smaller than the smallest disc) */
    --shrink: 0.18;
    /* COLOURS: gradient runs light > dark > light across each disc */
    --light: #fff;
    --dark: #000;

    position: relative;
    width: 100%;
    max-width: 680px;
    aspect-ratio: 340 / 318;   /* artboard of the original recording */
    outline: none;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .nd .dot {
    position: absolute;
    left: calc(var(--x) / 340 * 100%);
    top: calc(var(--y) / 318 * 100%);
    width: calc(var(--r) * 2 / 340 * 100%);
    aspect-ratio: 1;
    translate: -50% -50%;
    scale: var(--s-rest, 1);   /* set by the script: the size this dot has when not hovered */
    transition: scale .8s cubic-bezier(.2, .8, .2, 1);
  }

  .nd .disc {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(90deg, var(--light), var(--dark) 50%, var(--light));
    will-change: transform;
    /* --turns = whole number of counter-clockwise turns per loop */
    animation: nd-spin calc(var(--loop) * 1s) linear infinite;
  }

  @keyframes nd-spin {
    to { transform: rotate(calc(var(--turns) * -360deg)); }
  }

  /* hover / keyboard focus: freeze rotation and shrink the dots.
     --s-hover / --s-rest are set per dot by the script below;
     without JS every dot simply shrinks to the same size. */
  .nd:hover .disc,
  .nd:focus-visible .disc { animation-play-state: paused; }

  .nd:hover .dot,
  .nd:focus-visible .dot { scale: var(--s-hover, calc(var(--equal-r) / var(--r))); }

  @media (prefers-reduced-motion: reduce) {
    .nd .disc { animation: none; }
    .nd .dot { transition: none; }
  }
  /* ---------- ... to here ---------- */
</style>
</head>
<body>
<header>
  <!-- NineDots markup. x / y / r are in the 340 x 318 artboard of the original.
       DOM order = stacking order (big discs at the back, small ones in front).
       --turns: bigger disc = slower. All values are different whole numbers, which
       is what makes every disc land back on its start angle at the same moment. -->
  <div class="nd" role="button" tabindex="0"
       aria-label="Nine discs with rotating black and white gradients. Activate to rearrange the dot sizes.">
    <!-- big row -->
    <span class="dot" style="--x:103.9; --y:209.5; --r:61.8; --turns:28"><i class="disc"></i></span>
    <span class="dot" style="--x:171.8; --y:209.2; --r:55.9; --turns:29"><i class="disc"></i></span>
    <span class="dot" style="--x:239.5; --y:209.0; --r:49.8; --turns:30"><i class="disc"></i></span>
    <!-- middle row -->
    <span class="dot" style="--x:104.9; --y:143.7; --r:44.9; --turns:31"><i class="disc"></i></span>
    <span class="dot" style="--x:172.2; --y:142.7; --r:37.7; --turns:32"><i class="disc"></i></span>
    <span class="dot" style="--x:239.2; --y:142.6; --r:31.6; --turns:33"><i class="disc"></i></span>
    <!-- small row -->
    <span class="dot" style="--x:104.7; --y:74.8; --r:24.9; --turns:34"><i class="disc"></i></span>
    <span class="dot" style="--x:172.1; --y:74.8; --r:18.6; --turns:35"><i class="disc"></i></span>
    <span class="dot" style="--x:239.3; --y:74.9; --r:12.3; --turns:36"><i class="disc"></i></span>
  </div>

  <script>
  /* Click (or Enter / Space) = next state. There are 9! + 1 = 362,881 of them:
       state 0      : original artwork; on hover all nine dots shrink to the same size (--equal-r)
       states 1..9! : the nine original sizes handed out in a new arrangement. It applies to the
                      full-size discs as well as to the hover state (the same sizes x --shrink).
     The 9! = 362,880 arrangements are visited in a scrambled order, so every click changes many
     dots at once, and each arrangement comes up exactly once per cycle
     (index = state * STRIDE mod 9!; STRIDE has no factor 2, 3, 5 or 7, so it is a bijection).
     After the last one the next click goes back to state 0. The state is kept when the mouse
     leaves (the full-size discs keep the new arrangement). Bigger discs are always stacked behind smaller ones, as in the original. */
  (() => {
    const nd   = document.querySelector('.nd');
    const dots = [...nd.querySelectorAll('.dot')];
    const n    = dots.length;
    const css  = (el, p) => parseFloat(getComputedStyle(el).getPropertyValue(p));
    const R    = dots.map(d => css(d, '--r'));          // own radii, biggest first
    const equalR = css(nd, '--equal-r'), shrink = css(nd, '--shrink');

    const FACT = [1]; for (let i = 1; i <= n; i++) FACT[i] = FACT[i - 1] * i;
    const N = FACT[n], STRIDE = 40009;

    function unrank(idx) {                              // idx -> permutation of 0..n-1
      const pool = [...Array(n).keys()], out = [];
      for (let i = 0; i < n; i++) {
        const f = FACT[n - 1 - i], q = Math.floor(idx / f);
        idx -= q * f; out.push(pool.splice(q, 1)[0]);
      }
      return out;
    }

    let state = 0;                                      // 0 = original, 1..N = arrangements

    function apply() {
      const perm = state ? unrank((state * STRIDE) % N)
                         : [...Array(n).keys()];        // perm[i] = which size dot i gets (0 = biggest)
      dots.forEach((el, i) => {
        const k = R[perm[i]] / R[i];                    // full-size scale for this arrangement
        el.style.setProperty('--s-rest',  k.toFixed(4));
        el.style.setProperty('--s-hover', (state ? k * shrink : equalR / R[i]).toFixed(4));
        el.style.zIndex = perm[i];                      // smaller disc = further in front
      });
    }

    function next() { state = (state + 1) % (N + 1); apply(); }

    apply();
    nd.addEventListener('click', next);
    nd.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
    });
  })();
  </script>
</header>
</body>
</html>
